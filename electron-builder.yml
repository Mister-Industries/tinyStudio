appId: cc.tinystudio.app
productName: tinyStudio
directories:
  buildResources: build
# Ship the built app and its manifest. electron-builder adds the production
# dependencies from node_modules on its own; nothing else in the repo (docs,
# scripts, sources, fetched binaries) belongs in the install.
files:
  - out/**/*
  - package.json
# asar is disabled: tinyService runs as a child Node process that imports
# @mister-industries/tinyservice (an ESM package) from node_modules, which Node's
# ESM loader can't do from inside an asar archive.
asar: false
extraResources:
  # arduino-cli binaries are fetched into vendor/ by scripts/fetch-arduino-cli.mjs
  # (run automatically via the "prebuild" npm hook).
  - from: vendor/arduino-cli/macos-x64/arduino-cli
    to: arduino-cli/darwin-x64/arduino-cli
    filter:
      - '**/*'
  - from: vendor/arduino-cli/macos-arm64/arduino-cli
    to: arduino-cli/darwin-arm64/arduino-cli
    filter:
      - '**/*'
  - from: vendor/arduino-cli/linux-x64/arduino-cli
    to: arduino-cli/linux-x64/arduino-cli
    filter:
      - '**/*'
  - from: vendor/arduino-cli/linux-arm64/arduino-cli
    to: arduino-cli/linux-arm64/arduino-cli
    filter:
      - '**/*'
  - from: vendor/arduino-cli/windows-x64/arduino-cli.exe
    to: arduino-cli/win32-x64/arduino-cli.exe
    filter:
      - '**/*'
  # arduino-language-server + clangd (optional; fetched by
  # scripts/fetch-language-server.mjs). Powers editor code intelligence via
  # tinyService's /lsp bridge; the app degrades gracefully when absent.
  - from: vendor/language-server
    to: language-server
    filter:
      - '**/*'
win:
  executableName: tinystudio
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: MR.INDUSTRIES
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
