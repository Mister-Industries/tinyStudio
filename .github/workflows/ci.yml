name: CI

# Typecheck, lint, test and build the web bundle on every push to main or a
# version branch, and on pull requests into main. Desktop installers are built
# by release.yml (see docs/releasing.md), not here.

on:
  push:
    branches: [main, 'v*-dev']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install scripts download Electron and arduino-cli and rebuild app deps
      # for Electron. None of the checks below need them.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
