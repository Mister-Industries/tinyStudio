<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>tinyStudio</title>
    <!--
      Content Security Policy. Script runs only from the app's own files; sketches
      run in the sandboxed sketch-runner frame, never here. The dev server adds
      inline script for Vite's React Refresh preamble (vite-plugins.ts devCsp).
      connect-src allows any localhost port because tinyService moves off 3000
      when that port is taken.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' ws://localhost:* http://localhost:* ws://127.0.0.1:* http://127.0.0.1:* https://api.github.com https://raw.githubusercontent.com https://api.anthropic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; frame-src 'self'; object-src 'none'; base-uri 'self'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
